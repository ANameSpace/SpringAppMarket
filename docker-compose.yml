services:
  eureka-server:
    build:
      context: .
      dockerfile: ./eureka-server/Dockerfile
    container_name: eureka-server
    environment:
      - PORT=8761
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: on-failure
    networks:
      - microservices-network

  cloud-config-server:
    build:
      context: .
      dockerfile: ./cloud-config-server/Dockerfile
    container_name: cloud-config-server
    environment:
      - PORT=8888
      - SPRING_PROFILES_ACTIVE=native
      - CONFIG_LOCATION=file:/app/config/
      - EUREKA_URL=http://eureka-server:8761/eureka/
    volumes:
      - ./cloud-config-repo:/app/config:ro
    healthcheck:
      # Downstream services load their configuration through Eureka discovery,
      # so the config server is ready only after it is registered there.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://eureka-server:8761/eureka/apps/CLOUD-CONFIG-SERVER || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    depends_on:
      eureka-server:
        condition: service_healthy
    restart: on-failure
    networks:
      - microservices-network

  gateway-server:
    build:
      context: .
      dockerfile: ./gateway-server/Dockerfile
    container_name: gateway-server
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - AUTH_SERVER_URL=http://user-service:8081/auth-server
      - AUTH_SERVER_ISSUER=http://user-service:8081/auth-server
      - GATEWAY_CLIENT_SECRET=${GATEWAY_CLIENT_SECRET}
    depends_on:
      eureka-server:
        condition: service_healthy
      cloud-config-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      frontend-app:
        condition: service_healthy
      grafana:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: on-failure
    networks:
      - microservices-network

  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    container_name: user-service
    environment:
      - PORT=8081
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - AUTH_SERVER_URL=http://user-service:8081/auth-server
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - GATEWAY_CLIENT_SECRET=${GATEWAY_CLIENT_SECRET}
      - GRAFANA_CLIENT_SECRET=${GRAFANA_CLIENT_SECRET}
      - APP_USER_NAME=${APP_USER_NAME}
      - APP_USER_PASSWORD=${APP_USER_PASSWORD}
      - AUTH_SERVER_ISSUER=http://user-service:8081/auth-server
      - GATEWAY_PUBLIC_URL=http://localhost:8080 # адрес для swaggerui
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/auth-server/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      eureka-server:
        condition: service_healthy
      cloud-config-server:
        condition: service_healthy
    restart: on-failure
    networks:
      - microservices-network

  frontend-app:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
    container_name: frontend-app
    environment:
      # The frontend only renders the identity forwarded by the gateway.
      - API_DOCS_URL=/swagger-ui.html
      - GRAFANA_URL=/grafana/
      - OAUTH_LOGIN_URL=/oauth2/authorization/gateway-client-oidc
    depends_on:
      user-service:
        condition: service_healthy
    restart: on-failure
    networks:
      - microservices-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - microservices-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-grafana-bootstrap}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      # Users are created on first OAuth login. The generic OAuth role mapping
      # still rejects anyone without the ADMIN role.
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:8080/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_AUTH_BASIC_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=user-service
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=http://localhost:8080/auth-server/oauth2/authorize
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=http://user-service:8081/auth-server/oauth2/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=http://user-service:8081/auth-server/userinfo
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
      - GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH=preferred_username
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(roles[*], 'ADMIN') && 'Admin'
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=true
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
    depends_on:
      - prometheus
    networks:
      - microservices-network

  garage:
    image: dxflrs/garage:v2.5.0
    container_name: garage
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      # Встроенные переменные Garage для авто-создания ключей и бакета:
      - GARAGE_DEFAULT_ACCESS_KEY=${S3_ACCESS_KEY}
      - GARAGE_DEFAULT_SECRET_KEY=${S3_SECRET_KEY}
      - GARAGE_DEFAULT_BUCKET=app-market
    volumes:
      - garage_data:/var/lib/garage
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
    ports:
      - "3900:3900" # S3 API
    # Официальная и правильная команда запуска для одиночной ноды:
    command: [ "/garage", "server", "--single-node", "--default-bucket" ]
    healthcheck:
      test: [ "CMD", "/garage", "status" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - microservices-network

  app-service:
    build:
      context: .
      dockerfile: ./app-service/Dockerfile
    container_name: app-service
    environment:
      - PORT=8080
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - DATABASE_URL=${APP_DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - AUTH_SERVER_URL=http://user-service:8081/auth-server
      - S3_BUCKET=${S3_BUCKET:-app-market}
      - S3_REGION=${S3_REGION:-garage}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_ENDPOINT=http://garage:3900
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-http://localhost:3900}
      - ORDER_SERVICE_URL=http://order-service:8080
      - REVIEW_SERVICE_URL=http://review-service:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      eureka-server:
        condition: service_healthy
      cloud-config-server:
        condition: service_healthy
      garage:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: on-failure
    networks:
      - microservices-network

  review-service:
    build:
      context: .
      dockerfile: ./review-service/Dockerfile
    container_name: review-service
    environment:
      - PORT=8080
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - DATABASE_URL=${REVIEW_DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      eureka-server:
        condition: service_started
      cloud-config-server:
        condition: service_healthy
    restart: on-failure
    networks:
      - microservices-network

  order-service:
    build:
      context: .
      dockerfile: ./order-service/Dockerfile
    container_name: order-service
    environment:
      - PORT=8080
      - EUREKA_URL=http://eureka-server:8761/eureka/
      - DATABASE_URL=${ORDER_DATABASE_URL}
      - DATABASE_USERNAME=${DATABASE_USERNAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      eureka-server:
        condition: service_started
      cloud-config-server:
        condition: service_healthy
    restart: on-failure
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  garage_data:
