server:
  port: ${PORT:8080}

spring:
  application:
    name: app-service
  cloud:
    config:
      fail-fast: true
      discovery:
        enabled: true
        service-id: cloud-config-server
  config:
    import: "optional:configserver:"

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}