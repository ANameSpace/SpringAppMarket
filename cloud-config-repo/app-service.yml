server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/app_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  storage:
    bucket: ${S3_BUCKET:app-market}
    region: ${S3_REGION:garage}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    endpoint: ${S3_ENDPOINT:http://localhost:3900}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:http://localhost:3900}
    path-style: true
    cors-allowed-origins:
      - http://localhost:8080
      - http://127.0.0.1:8080
      - http://localhost:3000
      - http://127.0.0.1:3000
  download-ttl: ${APP_DOWNLOAD_TTL:10m}
  upload-ttl: ${APP_UPLOAD_TTL:10m}
  integrations:
    order-service-url: ${ORDER_SERVICE_URL:http://order-service:8080}
    review-service-url: ${REVIEW_SERVICE_URL:http://review-service:8080}
    stub-purchase-check: ${ORDER_STUB_PURCHASE_CHECK:true}
